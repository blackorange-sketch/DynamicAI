name: Build Godot AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.2.2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build AAR
        run: |
          mkdir -p build
          godot --headless --export-release "Android AAR" build/DynamicAIAvatar.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicAIAvatar-aar
          path: build/DynamicAIAvatar.aar
