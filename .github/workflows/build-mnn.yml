name: Build MNN native libs

# Перезбирає libMNN.so і libmnnllmapp.so (JNI з MNN Chat) потрібної версії MNN і кладе їх у
# app/src/main/jniLibs/arm64-v8a. Запускається, коли змінюється .github/mnn-version, або вручну.
on:
  push:
    branches: [ feature/mnn-engine ]
    paths: [ '.github/mnn-version' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mnn:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Read MNN version
        id: ver
        run: echo "tag=$(tr -d ' \n\r' < .github/mnn-version)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          repository: alibaba/MNN
          ref: ${{ steps.ver.outputs.tag }}
          path: mnn
          fetch-depth: 1

      - name: Install NDK 27.2 (same as MNN Chat)
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"

      - name: Build libMNN.so (LLM, OpenCL, ARM82, vision, audio)
        working-directory: mnn/project/android
        run: |
          mkdir -p build_64 && cd build_64
          ../build_64.sh "-DMNN_LOW_MEMORY=true -DMNN_CPU_WEIGHT_DEQUANT_GEMM=true -DMNN_BUILD_LLM=true -DMNN_SUPPORT_TRANSFORMER_FUSE=true -DMNN_ARM82=true -DMNN_USE_LOGCAT=true -DMNN_OPENCL=true -DLLM_SUPPORT_VISION=true -DMNN_BUILD_OPENCV=true -DMNN_IMGCODECS=true -DLLM_SUPPORT_AUDIO=true -DMNN_BUILD_AUDIO=true -DMNN_BUILD_DIFFUSION=ON -DMNN_SEP_BUILD=OFF -DMNN_BUILD_TEST=OFF -DMNN_BUILD_BENCHMARK=OFF -DCMAKE_SHARED_LINKER_FLAGS='-Wl,-z,max-page-size=16384' -DCMAKE_INSTALL_PREFIX=."
          make install -j"$(nproc)"
          ls -la lib

      - name: Build libmnnllmapp.so (MNN Chat JNI)
        run: |
          cmake -S mnn/apps/Android/MnnLlmChat/app/src/main/cpp -B mnnapp \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-33 -DANDROID_STL=c++_static \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build mnnapp -j"$(nproc)"

      - name: Strip and copy into jniLibs
        run: |
          STRIP="$ANDROID_NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          DST=app/src/main/jniLibs/arm64-v8a
          cp mnn/project/android/build_64/lib/libMNN.so "$DST/libMNN.so"
          cp mnnapp/libmnnllmapp.so "$DST/libmnnllmapp.so"
          "$STRIP" --strip-unneeded "$DST/libMNN.so" "$DST/libmnnllmapp.so"
          ls -la "$DST"

      - name: Commit updated libraries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/arm64-v8a/libMNN.so app/src/main/jniLibs/arm64-v8a/libmnnllmapp.so
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "MNN ${{ steps.ver.outputs.tag }} native libraries (built in CI)"
          git push
