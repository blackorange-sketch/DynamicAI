name: Build Godot AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot and Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Setup Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 -noprompt

      - name: Manually Install Android Build Template
        run: |
          # ОБХІД ЗАВИСАННЯ: Розпаковуємо шаблон вручну замість запуску godot --install...
          mkdir -p godot_project/android/build
          unzip -q ~/.local/share/godot/export_templates/4.3.stable/android_source.zip -d godot_project/android/

      - name: Build AAR
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p godot_project/build
          ./godot --headless --path godot_project --export-release "Android AAR" build/DynamicAIAvatar.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicAIAvatar-aar
          path: godot_project/build/DynamicAIAvatar.aar
