name: Build Godot AAR

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot and Export Templates
        run: |
          # Завантажуємо Godot для Linux (x86_64)
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_linux.x86_64.zip
          unzip Godot_v4.2.2-stable_linux.x86_64.zip
          mv Godot_v4.2.2-stable_linux.x86_64 godot
          chmod +x godot

          # Завантажуємо офіційні шаблони експорту
          wget https://github.com/godotengine/godot/releases/download/4.2.2-stable/Godot_v4.2.2-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/templates/4.2.2.stable
          unzip Godot_v4.2.2-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/templates/4.2.2.stable/

      - name: Setup Keystore
        run: |
          keytool -keyalg RSA -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -validity 9999 -deststoretype pkcs12 -noprompt

      - name: Import Project
        run: |
          ./godot --headless --editor --quit --path godot_project || true

      - name: Install Android Build Template
        run: |
          # Вказуємо Godot, де знаходиться Android SDK на серверах GitHub
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          ./godot --headless --path godot_project --install-android-build-template || true

      - name: Build AAR
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p godot_project/build
          ./godot --headless --path godot_project --export-release "Android AAR" build/DynamicAIAvatar.aar

      - name: Upload AAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicAIAvatar-aar
          path: godot_project/build/DynamicAIAvatar.aar
