name: Export Godot PCK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Godot and Export Templates
        run: |
          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip
          unzip Godot_v4.3-stable_linux.x86_64.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot

          wget https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          unzip Godot_v4.3-stable_export_templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/4.3.stable/

      - name: Export PCK
        run: |
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          mkdir -p godot_project/build
          # Експортуємо пакет ресурсів. Це стандартна і підтримувана операція.
          ./godot --headless --path godot_project --export-pack "Android AAR" build/DynamicAIAvatar.pck

      - name: Upload PCK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicAIAvatar-pck
          path: godot_project/build/DynamicAIAvatar.pck
